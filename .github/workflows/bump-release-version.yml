name: Bump release version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: bump release version') }}"
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history without file contents (those download on demand), so the inspect step
          # can read package.json as it was before this push without pulling every old exe.
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Inspect pushed commits
        id: inspect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const { execFileSync } = require('node:child_process')
          const { readFileSync } = require('node:fs')
          // Skip a push that already changed the version (a release, or a manual bump). This
          // compares package.json before and after the push: Actions' push payload has no
          // per-commit file lists (commit.added/modified are missing), so checking which files
          // a push touched never fired and releases got bumped a second time.
          const commits = JSON.parse(process.env.COMMITS_JSON || '[]')
          const userCommits = commits.filter((commit) => !String(commit.message || '').startsWith('chore: bump release version'))
          const versionOf = (json) => JSON.parse(json).version
          const after = versionOf(readFileSync('package.json', 'utf8'))
          let before = null
          try {
            const old = execFileSync('git', ['show', `${process.env.BEFORE_SHA}:package.json`], {
              encoding: 'utf8',
              stdio: ['ignore', 'pipe', 'ignore']
            })
            before = versionOf(old)
          } catch {
            // First push of the branch (before is all zeros) or a force push: bump as usual.
          }
          const versionChanged = before !== null && before !== after
          console.error(`version ${before ?? 'unknown'} -> ${after}, ${userCommits.length} pushed commit(s)`)
          console.log(`count=${userCommits.length}`)
          console.log(`skip=${versionChanged || userCommits.length === 0}`)
          NODE

      - name: Bump release version
        if: ${{ steps.inspect.outputs.skip != 'true' }}
        run: npm run release:bump-version -- --count ${{ steps.inspect.outputs.count }}

      # Desktop artifacts are NOT built here: packaging is ~165 MB and committing it on
      # every push is what let a stale installer sit on the site for months. Ship a release
      # with `npm run dist:win && npm run release:stage-web` instead.
      - name: Commit version bump
        if: ${{ steps.inspect.outputs.skip != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/renderer/src/MainShell.tsx src/renderer/src/WebDraftApp.tsx
          git diff --cached --quiet || git commit -m "chore: bump release version"
          git push
