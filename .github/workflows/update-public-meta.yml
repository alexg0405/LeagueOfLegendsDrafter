name: Update public meta data

on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * *'

permissions:
  contents: write

jobs:
  update-public-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Each source is independent: a U.GG hiccup must not block the Lolalytics refresh (or vice versa).
      - name: Refresh champion build paths (U.GG Emerald+)
        continue-on-error: true
        run: npm run items:update:ugg

      - name: Refresh public meta (Lolalytics Emerald+)
        continue-on-error: true
        run: npm run meta:update:mobalytics

      # Never ship data that breaks the app.
      - name: Test with refreshed data
        run: npm test

      - name: Commit refreshed public data
        run: |
          paths="src/shared/data/publicMetaStatsSeed.json src/shared/data/publicSynergyStatsSeed.json src/shared/data/uggDefaultItemBuildsSeed.json src/shared/data/buildPathsSeed.json src/renderer/public/data"
          if git diff --quiet -- $paths; then
            echo "No public data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $paths
          git commit -m "Update public meta and build data"
          git push
